name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ЕТАП 1: Статичний аналіз коду (SAST - SonarCloud)
  sast-sonarqube:
    name: 1. SAST - SonarQube Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ЕТАП 2: Аудит безпеки інфраструктури (IaC - Checkov)
  iac-security-checkov:
    name: 2. IaC Scan - Checkov Terraform Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV2_AWS_61,CKV2_AWS_62 # Пропускаємо перевірки крос-регіональної реплікації та логування для навчального бакета

  # ЕТАП 3 & 4: Управління секретами (Vault), Розгортання (Terraform) та Динамічне тестування (OWASP ZAP)
  vault-deploy-and-dast:
    name: 3. Vault Secrets, Terraform Deploy & OWASP ZAP DAST
    needs: [sast-sonarqube, iac-security-checkov] # Запускається ТІЛЬКИ якщо SAST і Checkov пройшли успішно!
    runs-on: ubuntu-latest

    services:
      # Піднімаємо HashiCorp Vault як сервіс для управління секретами
      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: "root-token-coursework"
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        options: --cap-add=IPC_LOCK

      # Піднімаємо LocalStack (імітатор хмари AWS)
      localstack:
        image: localstack/localstack:3.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure HashiCorp Vault & Fetch Secrets
        env:
          VAULT_ADDR: "http://127.0.0.1:8200"
          VAULT_TOKEN: "root-token-coursework"
        run: |
          # Встановлюємо утиліту jq для парсингу JSON-відповіді від Vault
          sudo apt-get update && sudo apt-get install -y jq curl

          # Записуємо секрети в захищене сховище HashiCorp Vault (KV v2 engine)
          curl --header "X-Vault-Token: $VAULT_TOKEN" \
               --request POST \
               --data '{"data": {"aws_access_key": "vault_dynamic_access_key", "aws_secret_key": "vault_dynamic_secret_key", "api_secret": "vault_managed_app_token_999"}}' \
               $VAULT_ADDR/v1/secret/data/devsecops

          # Отримуємо секрети з Vault під час виконання пайплайну та маскуємо їх у логах
          SECRET_JSON=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/secret/data/devsecops)

          AWS_KEY=$(echo $SECRET_JSON | jq -r '.data.data.aws_access_key')
          AWS_SEC=$(echo $SECRET_JSON | jq -r '.data.data.aws_secret_key')
          APP_SEC=$(echo $SECRET_JSON | jq -r '.data.data.api_secret')

          echo "::add-mask::$AWS_KEY"
          echo "::add-mask::$AWS_SEC"
          echo "::add-mask::$APP_SEC"

          echo "TF_VAR_aws_access_key=$AWS_KEY" >> $GITHUB_ENV
          echo "TF_VAR_aws_secret_key=$AWS_SEC" >> $GITHUB_ENV
          echo "API_SECRET_KEY=$APP_SEC" >> $GITHUB_ENV
          echo "Секрети успішно отримано з HashiCorp Vault!"

      - name: Setup Terraform & Deploy Cloud Infrastructure
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: terraform
        run: |
          terraform init
          terraform plan
          terraform apply -auto-approve

      - name: Start Web Application (Staging)
        run: |
          pip install -r app/requirements.txt
          nohup python app/app.py > app.log 2>&1 &
          sleep 5
          curl -I http://localhost:5000

      - name: Run OWASP ZAP Dynamic Scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://172.17.0.1:5000'
          rules_file_name: ''
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false # Не валимо збірку на попередженнях (WARN), щоб зберегти звіт

      - name: Upload OWASP ZAP Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-security-report
          path: report_html.html
